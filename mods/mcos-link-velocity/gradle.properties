# MCOS Link (Velocity) — derleme ayarları
#
# NEDEN BU EKLENTİ: ortak dünyanın tek adresi kurucudaki Velocity proxy'sidir.
# Arka uç listesi eskiden velocity.toml'a yazılıyordu ve liste her değiştiğinde
# (yeni PC eşleşti, bir PC'nin IP'si/portu değişti, yerel kopya açıldı/kapandı)
# MCOS Velocity'yi YENİDEN BAŞLATIYORDU: proxy'deki bütün oyuncular düşüyordu.
# Bu eklenti listeyi MCOS'tan (/link/proxy) okur ve çalışan proxy'ye kendisi
# ekler/çıkarır; kimse düşmez.

org.gradle.jvmargs=-Xmx1G

# ── Velocity ────────────────────────────────────────────────────────────────
# MCOS'un çalıştırdığı Velocity 4.2.0 ile AYNI API (repo.papermc.io
# com.velocitypowered:velocity-api maven-metadata'sında 4.2.0 var). API
# sınıfları Java 25 bayt kodudur (sınıf sürümü 69); Velocity 4.2.0 da Java 25
# ister, bu yüzden eklenti de Java 25 ile derlenir.
velocity_api_version=4.2.0

plugin_version=1.0.0
maven_group=gg.mcos
archives_base_name=mcos-link-velocity
