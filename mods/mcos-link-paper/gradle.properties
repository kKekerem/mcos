# MCOS Link (Paper) — derleme ayarları
#
# ════════════════════════════════════════════════════════════════════════════
# NEDEN AYRI BİR MODÜL
# ════════════════════════════════════════════════════════════════════════════
#
# Fabric ve Paper AYRI yükleyici platformlarıdır. Fabric modları mods/
# altından, Paper eklentileri plugins/ altından yüklenir ve ikisi birbirinin
# dosyasını TANIMAZ. Tek bir jar ile ikisini birden beslemek mümkün değil.
#
# İkisi de AYNI tel protokolünü konuşur (LinkProtocol), yani bir Paper düğümü
# ile bir Fabric düğümü aynı ortak dünyayı paylaşabilir.

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# ── Paper ───────────────────────────────────────────────────────────────────
# paper-api sürümü, sunucunun çalıştığı Minecraft sürümüyle TAM OLARAK aynı
# olmalı — ana sürümün tutması yetmez.
#
# NEDEN TAM EŞLEŞME: ../mcos-link/gradle.properties içinde
# minecraft_version=1.21.11 pinlidir ve gerekçesi orada yazılıdır — "farklı
# sürümler farklı dünya üretir ve aktarılan oyuncu bağlantıyı kaybeder". Aynı
# sürüm MCOS'un çevrimdışı paketinde de pinlidir
# (os/buildroot/external/board/mcos/offline-manifest.txt, HEDEF SÜRÜM:
# Minecraft 1.21.11). 1.21.11 yerine 1.21.1 için derlenmiş bir Paper düğümü,
# Fabric eşiyle AYNI dünyayı paylaşamaz: iki düğüm farklı arazi üretir ve
# sınırı geçen oyuncu karşı tarafta bambaşka bir dünyaya düşer.
#
# İKİNCİ ve bağımsız sebep: PlayerData#directory(),
# Server#getLevelDirectory() kullanır. Bu metodun imzası elimizdeki
# doğrulanmış API dosyasında YALNIZCA güncel paper-api'den alıntılanmıştır;
# hangi sürümde eklendiği ORADA DA doğrulanmamıştır. 1.21.1 (Ağustos 2024)
# için var olduğunu varsaymak için elimizde hiçbir kanıt yok — o sürümde
# derleme "cannot find symbol: method getLevelDirectory()" ile kırılabilir.
# 1.21.11 ise hem kümenin çalıştırdığı sürümdür hem de paper-api'de
# yayımlandığı doğrulanmıştır.
#
# Ve eğer bir gün getLevelDirectory() gerçekten kullanılamazsa, yerine
# Server#getWorldContainer() KONULMAZ: o metot @ApiStatus.Obsolete'tir ve
# seviye klasörünün EBEVEYNİNİ döndürür — sonuç, her aktarımın "oyuncu kaydı
# bulunamadı" ile iptal olmasıdır. Bkz. PlayerData sınıf açıklaması.
#
# Java 21 DEĞİŞMEZ: 1.21.11 için doğru olan odur (build.gradle'da
# options.release = 21). Yalnızca Paper'ın yeni takvim sürümlerine
# (26.x.build.N-stable) geçilirse Java 25 gerekir; o şema ise sürümü
# çevrimdışı paketten KOPARIR ve bu yüzden bilerek kullanılmıyor.
#
# Not: derleme YALNIZCA compileOnly bağımlılığıdır; jar'a hiçbir Paper sınıfı
# gömülmez, bu yüzden jar birkaç kilobayttır.
paper_api_version=1.21.11-R0.1-SNAPSHOT

# ── Gson ────────────────────────────────────────────────────────────────────
# Tel protokolünün başlıkları Gson ile kurulur. Sunucuda zaten vardır
# (Minecraft onu kullanır), bu yüzden compileOnly'dir ve jar'a GÖMÜLMEZ.
# Gölgelemek (shadow/relocate) protokolü bozar: başlık,
# JsonObject#toString() çıktısıdır ve Fabric eşle bayt bayt eşleşmelidir.
gson_version=2.11.0

# ── SLF4J ───────────────────────────────────────────────────────────────────
# Log sınıfı org.slf4j.Logger kullanır. paper-api onu geçişli olarak getirir
# (Plugin#getSLF4JLogger() zaten org.slf4j.Logger döndürür), ama Gson'u
# açıkça isteyip bunu geçişliliğe bırakmak TUTARSIZDI: bağımlılık grafiği bir
# gün budanırsa "package org.slf4j does not exist" ile derleme kırılırdı.
#
# Sürüm numarası burada önemsizdir çünkü compileOnly'dir ve yalnızca
# Logger#info/warn/error kullanılır — bu üçü SLF4J'nin her 1.7/2.0
# sürümünde aynıdır. Çalışma anındaki gerçek uygulamayı sunucu sağlar; bu
# satır yalnızca DERLEME zamanında paketin var olduğunu garanti eder ve
# çalışma anında hangi sürümün yükleneceğini DEĞİŞTİRMEZ.
slf4j_version=2.0.12

# ── Eklenti ─────────────────────────────────────────────────────────────────
plugin_version=1.0.1
maven_group=gg.mcos
archives_base_name=mcos-link-paper
