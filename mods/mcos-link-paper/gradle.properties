# MCOS Link (Paper) — derleme ayarları
#
# ════════════════════════════════════════════════════════════════════════════
# NEDEN AYRI BİR MODÜL
# ════════════════════════════════════════════════════════════════════════════
#
# Fabric ve Paper AYRI yükleyici platformlarıdır. Fabric modları mods/
# altından, Paper eklentileri plugins/ altından yüklenir ve ikisi birbirinin
# dosyasını TANIMAZ. Tek bir jar ile ikisini birden beslemek mümkün değil.
#
# İkisi de AYNI tel protokolünü konuşur (LinkProtocol), yani bir Paper düğümü
# ile bir Fabric düğümü aynı ortak dünyayı paylaşabilir.

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# ── Paper ───────────────────────────────────────────────────────────────────
# TEK jar, 1.20.5 .. 26.3 arasındaki TÜM Paper/Purpur sürümleri için.
#
# NEDEN ARTIK TAM EŞLEŞME YOK: burada eskiden paper_api_version=1.21.11
# pinliydi ve plugin.yml api-version '1.21.11' diyordu; gerekçe "kümedeki
# her düğüm aynı Minecraft sürümünü çalıştırmalı" idi. Bunun bedeli
# ölçüldü: 1.21.1 sunucusu eklentiyi "Unsupported API version 1.21.11" diye
# reddetti ve MCOS ortak dünyayı açarken "mcos-link modu kurulu değil" dedi.
# Sürüm eşitliği artık MCOS'un işi: eşin sunucusu LinkSpec ile AYNI yazılım
# ve AYNI sürümle kuruluyor. Eklentinin işi yalnızca her sürümde çalışmak.
#
# NEDEN 1.20.6 (ve 1.20.5 DEĞİL): derleme, eklentinin kullandığı her şeyin
# bulunduğu EN ESKİ API'ye karşı yapılır — daha yeni bir API'de eklenmiş bir
# metot derlemede görünmesin, eski sunucuda NoSuchMethodError olmasın.
# Alt sınır Player#transfer'dir (1.20.5 ile geldi). Ama
# paper-api:1.20.5-R0.1-SNAPSHOT ÇÖZÜLEMİYOR: POM'u
# net.kyori:adventure-bom:4.17.0-SNAPSHOT istiyor ve o artık depoda yok
# ("Could not find net.kyori:adventure-bom:4.17.0-SNAPSHOT", denendi).
# 1.20.6 çözülen en eski sürümdür; api-version yine de '1.20.5'tir ve
# 1.20.5 sunucusunda gerçekten yüklendiği denendi.
#
# 1.20.6'ya karşı derlemek neyi yakaladı: World#getWorldPath() 1.20.6'da
# YOK ("cannot find symbol"); 1.21.6 paper-api'de de yok, 1.21.8'de var.
# 1.21.11'e karşı derlenen eski jar onu kullanıyordu, yani 1.21.8'den eski
# sunucularda aktarım anında NoSuchMethodError verecekti. Bkz. PlayerData.
#
# 26.x'e özgü metotlar (Server#getLevelDirectory) yansımayla çağrılır:
# 26.x paper-api sınıfları Java 25 (sınıf sürümü 69) ile derlenmiştir ve
# Java 21 derleyicisi onları okuyamaz. Bkz. PlayerData.
#
# Java 21 DEĞİŞMEZ (build.gradle'da options.release = 21): 1.20.5 .. 1.21.11
# Java 21 ile çalışır; 26.x Java 25 ister ama Java 21 bayt kodunu sorunsuz
# yükler (26.1.2, 26.2, 26.3 ve Purpur 26.3'te denendi). Release 25'e
# çıkmak, 1.21.x sunucularını UnsupportedClassVersionError ile kırardı.
#
# Not: derleme YALNIZCA compileOnly bağımlılığıdır; jar'a hiçbir Paper sınıfı
# gömülmez, bu yüzden jar birkaç kilobayttır.
paper_api_version=1.20.6-R0.1-SNAPSHOT

# ── Gson ────────────────────────────────────────────────────────────────────
# Tel protokolünün başlıkları Gson ile kurulur. Sunucuda zaten vardır
# (Minecraft onu kullanır), bu yüzden compileOnly'dir ve jar'a GÖMÜLMEZ.
# Gölgelemek (shadow/relocate) protokolü bozar: başlık,
# JsonObject#toString() çıktısıdır ve Fabric eşle bayt bayt eşleşmelidir.
gson_version=2.11.0

# ── SLF4J ───────────────────────────────────────────────────────────────────
# Log sınıfı org.slf4j.Logger kullanır. paper-api onu geçişli olarak getirir
# (Plugin#getSLF4JLogger() zaten org.slf4j.Logger döndürür), ama Gson'u
# açıkça isteyip bunu geçişliliğe bırakmak TUTARSIZDI: bağımlılık grafiği bir
# gün budanırsa "package org.slf4j does not exist" ile derleme kırılırdı.
#
# Sürüm numarası burada önemsizdir çünkü compileOnly'dir ve yalnızca
# Logger#info/warn/error kullanılır — bu üçü SLF4J'nin her 1.7/2.0
# sürümünde aynıdır. Çalışma anındaki gerçek uygulamayı sunucu sağlar; bu
# satır yalnızca DERLEME zamanında paketin var olduğunu garanti eder ve
# çalışma anında hangi sürümün yükleneceğini DEĞİŞTİRMEZ.
slf4j_version=2.0.12

# ── Eklenti ─────────────────────────────────────────────────────────────────
# 1.1.0: tek jar 1.20.5 .. 26.3 (api-version 1.20.5) ve 26.1+ kayıt klasörü
# (players/data) düzeltmesi. Tel protokolü 1.0.1 ile BAYT BAYT aynıdır.
plugin_version=1.1.0
maven_group=gg.mcos
archives_base_name=mcos-link-paper
