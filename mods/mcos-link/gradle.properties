# MCOS Link — derleme ayarları
#
# Bu dosyada sürüm numaraları TEK YERDE durur. Minecraft sürümünü
# yükseltirken yalnızca burayı değiştirmek yeterlidir; build.gradle'a
# dokunmak gerekmez.
#
# Eşleşen sürümleri bulmak için:
#   https://fabricmc.net/develop/

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# ── Minecraft ───────────────────────────────────────────────────────────────
# MCOS'un çevrimdışı paketiyle (os/buildroot/external/board/mcos/
# offline-manifest.txt) AYNI sürüm olmalı: farklı sürümler farklı dünya
# üretir ve aktarılan oyuncu bağlantıyı kaybeder.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.1
loader_version=0.19.5

# ── Mod ─────────────────────────────────────────────────────────────────────
mod_version=1.0.1
maven_group=gg.mcos
archives_base_name=mcos-link

# ── Fabric API ──────────────────────────────────────────────────────────────
# Yalnızca olay kancaları (lifecycle, networking) ve komut kaydı için.
#
# ── Düzeltilen gerçek hata ─────────────────────────────────────────────────
# Burada "0.135.0+1.21.11" yazıyordu ve BÖYLE BİR SÜRÜM YOK. Derleme şununla
# kırılıyordu:
#
#   Could not find net.fabricmc.fabric-api:fabric-api:0.135.0+1.21.11
#
# maven.fabricmc.net'in maven-metadata.xml'i okundu: 0.135 hattında yayımlanan
# üç sürüm var ve 1.21.11 için olan ilki 0.135.1'dir —
#
#   0.135.0+1.21.10   <- pin bir Minecraft sürümü kaymıştı
#   0.135.1+1.21.11
#   0.135.2+1.21.11
#
# Yani "0.135.0" gerçekten var, ama 1.21.10 için. Sürüm sonekindeki Minecraft
# numarasını elle değiştirmek, var olmayan bir yapıya işaret etmişti.
#
# Aşağıdaki değer, özgün pinin DOĞRU karşılığıdır: aynı 0.135 hattının 1.21.11
# için yayımlanmış son sürümü.
#
# ── Neden en güncel (0.141.6) DEĞİL ────────────────────────────────────────
# Önce 0.141.6+1.21.11 denendi ve derleme şununla kırıldı:
#
#   Failed to setup Minecraft, java.lang.IllegalStateException:
#   Javadoc provided by mod (fabric-content-registries-v0) must be have an
#   intermediary source namespace
#
# Bu bir Loom uyumsuzluğudur: build.gradle Fabric Loom 1.11.8 kullanıyor ve
# yeni fabric-api yapıları javadoc'u o sürümün tanımadığı bir ad uzayında
# yayımlıyor. Yani "en yeni sürüm" burada doğru seçim değil; Loom ile BİRLİKTE
# yükseltilmesi gereken bir çifttir. Sürüm atlamak istenirse ikisi aynı anda
# güncellenmeli ve derleme yeniden çalıştırılmalı.
#
# Yükseltirken iki kural: sonek minecraft_version ile AYNI olmalı ve o sürüm
# maven.fabricmc.net listesinde GERÇEKTEN bulunmalı.
fabric_version=0.135.2+1.21.11
