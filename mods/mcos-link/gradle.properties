# MCOS Link — ortak derleme ayarları
#
# Sürüme özgü her şey (Minecraft, Yarn, Fabric API, desteklenen sürümler)
# targets/<etiket>/target.properties içindedir. Burada yalnızca BÜTÜN
# jar'larda aynı olan değerler durur.
#
# Eşleşen sürümleri bulmak için:
#   https://fabricmc.net/develop/

# Üç Loom projesi aynı Gradle sürecinde Minecraft'ı ayrı ayrı açar; eski
# 2G tek proje içindi.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# ── Mod ─────────────────────────────────────────────────────────────────────
# Jar'daki sürüm "<mod_version>+<etiket>" olur (ör. 1.1.0+26.1-26.3): sorun
# bildiren bir kullanıcının günlüğünde hangi jar'ın yüklendiği okunabilsin.
mod_version=1.1.0
maven_group=gg.mcos

# ── Fabric Loader ───────────────────────────────────────────────────────────
# Derlemede kullanılan sürüm. Sunucuda en az kaçının gerektiği her hedefin
# target.properties'indeki loader_min'dedir.
loader_version=0.19.5

# ── Eski tek jar (dist/mods/mcos-link.jar) ──────────────────────────────────
# Bu satırı DERLEME KULLANMAZ. Go tarafı (internal/daemon,
# TestFabricLinkSurumuGradleIleAyni) hâlâ tek jar düzenini bekliyor ve bu
# değeri fabricLinkMC ile karşılaştırıyor. Daemon dist/mods/link/
# index-fabric.tsv'yi okumaya geçince bu satır silinebilir; o zamana kadar
# 1.21.11 hedefinin (targets/1.21.11) sürümünü gösteriyor.
minecraft_version=1.21.11
