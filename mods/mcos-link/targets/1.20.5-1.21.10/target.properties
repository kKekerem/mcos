# Yarn eşlemeli sürümler, sayısal yetki seviyesi (hasPermissionLevel).
#
# ── Neden BU gruplama? (ölçüldü, tahmin değil) ─────────────────────────────
# Aynı kaynak 1.20.5, 1.20.6, 1.21, 1.21.1 … 1.21.10'un HER BİRİNE karşı ayrı
# ayrı derlendi ve remapJar çıktıları karşılaştırıldı: intermediary'ye
# eşlenmiş .class dosyaları 13 sürümde BAYT BAYT AYNI çıktı. Yani bu jar'ın
# başvurduğu her sınıf/alan/metot bu sürümlerin hepsinde aynı adla ve aynı
# imzayla duruyor. Ardından her sürümde gerçek bir sunucuda açıldı ve
# "mcoslink status" denendi.
#
# 1.21.11 bu gruba GİREMEZ: hasPermissionLevel o sürümde kaldırıldı
# (perm-level/Perms.java 1.21.11'de "cannot find symbol" ile kırılıyor).
adapter=yarn
perms=perm-level
java=21

# En eski sürüme karşı derlenir: eski sürümde bulunan bir API yenisinde de
# vardır, tersi her zaman doğru değildir.
minecraft_version=1.20.5
yarn_mappings=1.20.5+build.1
fabric_version=0.97.8+1.20.5
loader_min=0.16.0

# fabric.mod.json'daki depends.minecraft TAM OLARAK bu listedir. Eskiden
# ">=1.20.5" yazıyordu ve 1.21.11 için derlenen jar 1.21.1'e yükleniyor,
# sunucu açılışta NoSuchFieldError ile düşüyordu. Yalnızca doğrulanan
# sürümler: Fabric Loader başka bir sürümde modu açıkça reddeder.
supported=1.20.5,1.20.6,1.21,1.21.1,1.21.2,1.21.3,1.21.4,1.21.5,1.21.6,1.21.7,1.21.8,1.21.9,1.21.10
