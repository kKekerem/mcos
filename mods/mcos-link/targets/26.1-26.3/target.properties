# 26.x: karartılmamış Minecraft, Mojang'ın resmî adları, yeniden eşleme YOK.
#
# ── Neden BU gruplama? (ölçüldü) ────────────────────────────────────────────
# Kaynak 26.1, 26.1.1, 26.1.2, 26.2 ve 26.3'e karşı ayrı ayrı derlendi:
# .class dosyaları beşinde BAYT BAYT AYNI. Kullanılan her Minecraft üyesi
# (PlayerList, ClientboundTransferPacket, ClientboundTabListPacket,
# Commands.hasPermission, LevelResource.PLAYER_DATA_DIR …) 26.1 ve 26.3 sunucu
# jar'larında javap ile karşılaştırıldı; imzalar değişmemiş.
adapter=mojang
java=25

minecraft_version=26.1
fabric_version=0.145.1+26.1
# 26.x'i yükleyebilen ilk kararlı Loader; Fabric'in 26.1 duyurusu bunu önerir.
loader_min=0.18.4

supported=26.1,26.1.1,26.1.2,26.2,26.3
