# Yarn eşlemeli son sürüm; 1.21.11'in yeni izin sistemi (PermissionCheck).
#
# Tek sürümlük grup, çünkü 1.21.11 hasPermissionLevel'ı kaldırdı ve yerine
# gelen CommandManager.GAMEMASTERS_CHECK daha eski hiçbir sürümde yok
# (perm-check/Perms.java 1.20.5–1.21.10'un hepsinde "cannot find symbol").
adapter=yarn
perms=perm-check
java=21

minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_min=0.16.0

# ── Fabric API sürümü: geçmiş ──────────────────────────────────────────────
# Önce "0.135.0+1.21.11" pinlenmişti ve BÖYLE BİR SÜRÜM YOKTU (0.135.0,
# 1.21.10 içindi; sonekteki Minecraft numarası elle değiştirilmişti). Sonra
# 0.141.6 denendiğinde Loom 1.11.8 "Javadoc provided by mod
# (fabric-content-registries-v0) must be have an intermediary source
# namespace" ile kırılıyordu ve 0.135.2'de kalınmıştı. Loom artık 1.17.21
# (bkz. build.gradle) ve 0.141.6 onunla sorunsuz derleniyor — ölçüldü.
# Sunucuya kurulan da 0.141.6 olduğu için derleme ile çalışma aynı yapıda.
fabric_version=0.141.6+1.21.11

supported=1.21.11
