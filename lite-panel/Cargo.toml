[package]
name = "mcos-panel-lite"
version = "0.1.0"
edition = "2021"
description = "MCOS lite TUI panel (ratatui) for low-tier hosts; thin JSON-RPC client over the mcosd socket."

[[bin]]
name = "mcos-panel-lite"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
