# Bellek: Gradle varsayilani buyuk projelerde yetmez ve "OutOfMemoryError"
# ile duser. 4 GB, Flutter uygulamalari icin yaygin oneri.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError

# AndroidX: Flutter eklentilerinin tamami AndroidX kullanir.
android.useAndroidX=true
android.enableJetifier=true
