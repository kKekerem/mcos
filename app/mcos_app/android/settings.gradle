// Flutter'ın modern Android iskeleti (Flutter 3.16+).
//
// ── Neden bu biçim ──────────────────────────────────────────────────────────
// Eski "apply plugin" biçimi Flutter 3.16'dan sonra uyarı veriyor ve
// ileride kaldırılacak. Bu dosya, Flutter SDK'nın yolunu local.properties'ten
// okuyup eklenti deposunu kuruyor.
pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "local.properties içinde flutter.sdk yok"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.5.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.24" apply false
}

include ":app"
