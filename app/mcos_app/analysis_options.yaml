# Dart/Flutter statik çözümleme ayarları.
#
# ── Neden sıkı ──────────────────────────────────────────────────────────────
# Bu uygulama bir sunucunun TAM DENETİMİNİ elinde tutuyor: sunucu silme,
# makineyi kapatma. Sessizce yutulan bir hata ya da unutulan bir await,
# kullanıcının "dokundum ama olmadı" demesiyle sonuçlanır.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true

  errors:
    # Beklenmeyen bir await eksikliği, bu uygulamada gerçek bir hata:
    # eylem gönderilmeden ekran "tamam" der.
    unawaited_futures: error
    # Kullanılmayan içe aktarma, taşınmış bir kodun kalıntısıdır.
    unused_import: error
    unused_local_variable: error
    # BuildContext'i async boşluk sonrası kullanmak, ekran kapandıysa
    # çökme üretir. Bu uygulamada her RPC bir async boşluktur.
    use_build_context_synchronously: error
  exclude:
    - build/**
    - android/**

linter:
  rules:
    - always_declare_return_types
    - avoid_empty_else
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - prefer_const_constructors
    - prefer_final_locals
    - require_trailing_commas
    - unnecessary_await_in_return
