# builtin-java.conf — imaja (rootfs'e) GÖMÜLEN Java çalışma zamanı.
#
# Kullanıcının isteği: "OS'un içine Java'yı göm, hiç uğraşmayalım, direkt
# kurulu gelsin Java 21."
#
# Bu dosyayı İKİ betik okur (sh ile "." edilir, yalnızca ANAHTAR=değer):
#   scripts/fetch-builtin-java.sh        derlemeden önce indirir ve doğrular
#   board/mcos/builtin-java.sh           post-build'de TARGET_DIR'a açar
#
# ── Neden bu yapı ───────────────────────────────────────────────────────────
# Hedef libc glibc'dir (BR2_TOOLCHAIN_BUILDROOT_GLIBC=y; rootfs'te
# /lib64/ld-linux-x86-64.so.2). Temurin'in "linux" yapısı glibc içindir
# (release: LIBC="gnu"; ölçülen en yüksek sembol sürümü GLIBC_2.15). musl'e
# geçilirse "alpine-linux" yapısı gerekir — builtin-java.sh bunu denetleyip
# derlemeyi durdurur.
#
# JRE, JDK değil: sunucu çalıştırmak için javac/jlink ikilileri gerekmez.
# Temurin JRE yine de TÜM modülleri içerir (jdk.compiler dahil); yani
# eklentilerin isteyebileceği hiçbir modül eksik değildir.
#
# Lisans: GPLv2 + Classpath İstisnası; legal/ dizini bilerek imajda kalır.
#
# ── Güncelleme ──────────────────────────────────────────────────────────────
# Yeni bir Temurin 21 sürümü için URL ve SHA-256'yı birlikte değiştirin.
# Özet, Adoptium'un yayımladığı "<arşiv>.sha256.txt" dosyasından alınır:
#   curl -fsSL "<URL>.sha256.txt"
# Özet uyuşmazsa hem indirme hem post-build DURUR; sessizce eski arşivle
# devam edilmez.

JAVA_BUILTIN_MAJOR=21
JAVA_BUILTIN_URL=https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/OpenJDK21U-jre_x64_linux_hotspot_21.0.12.1_1.tar.gz
JAVA_BUILTIN_SHA256=2413149700df0f7d440500a84a8f764c535f21e5a5e87d38328b64eec2c5b500
