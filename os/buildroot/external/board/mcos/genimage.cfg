image mcos.img {
  hdimage {
    align = 1M
  }

  partition boot {
    partition-type = 0xEF
    bootable = "true"
    image = "boot.vfat"
    size = 64M
  }

  partition root {
    partition-type = 0x83
    image = "rootfs.ext2"
    size = 512M
  }
}

image boot.vfat {
  vfat {
    file EFI/BOOT/BOOTX64.EFI {
      image = "bzImage"
    }
    file bzImage {
      image = "bzImage"
    }
  }
  size = 64M
}
