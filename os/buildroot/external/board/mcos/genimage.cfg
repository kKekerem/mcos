# DURUM: BU DOSYA ŞU AN KULLANILMIYOR (ölü yapılandırma).
#
# Neden:
#   1. Aşağıdaki "rootfs.ext2" imajı hiç üretilmiyor — mcos_defconfig'de
#      BR2_TARGET_ROOTFS_EXT2 etkin değil; yalnızca BR2_TARGET_ROOTFS_CPIO var.
#   2. genimage'ı çağıran bir post-image betiği de yok
#      (BR2_ROOTFS_POST_IMAGE_SCRIPT ayarlanmamış).
#
# ISO üretimi bunun yerine üst düzey Makefile'ın "iso" hedefiyle,
# grub-mkrescue kullanılarak yapılır (bkz. Makefile: iso).
#
# Kullanmak isterseniz gerekenler:
#   - mcos_defconfig'e: BR2_TARGET_ROOTFS_EXT2=y ve BR2_TARGET_ROOTFS_EXT2_4=y
#   - BR2_PACKAGE_HOST_GENIMAGE=y
#   - BR2_ROOTFS_POST_IMAGE_SCRIPT ile genimage'ı çağıran bir betik
#   - "size = 512M" değeri gerçek rootfs boyutundan büyük olmalı: mevcut
#     rootfs.cpio 268 MB, sıkıştırılmamış ext4 bundan daha da büyük olur.
#
# Silmedim çünkü ileride SD kart / disk imajı üretmek isteyebilirsiniz.

image mcos.img {
  hdimage {
    align = 1M
  }

  partition boot {
    partition-type = 0xEF
    bootable = "true"
    image = "boot.vfat"
    size = 64M
  }

  partition root {
    partition-type = 0x83
    image = "rootfs.ext2"
    size = 512M
  }
}

image boot.vfat {
  vfat {
    file EFI/BOOT/BOOTX64.EFI {
      image = "bzImage"
    }
    file bzImage {
      image = "bzImage"
    }
  }
  size = 64M
}
